<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Let an observation change the design</title><desc id="desc">A four-step cycle moves from a reader trying to find the venue, to observing that they miss it, to revising the venue label, to testing again. The loop shows that a revision needs a new observation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" rx="16" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="28" text-anchor="start" fill="#183d31"><tspan x="35" dy="0">Let an observation change the design</tspan></text><rect x="50" y="105" width="340" height="130" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="68" y="140" font-size="23" text-anchor="start" fill="#183d31"><tspan x="68" dy="0">1. Try</tspan></text><text x="68" y="178" font-size="19" text-anchor="start" fill="#183d31"><tspan x="68" dy="0">Ask a reader to find the venue.</tspan></text><rect x="510" y="105" width="340" height="130" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="528" y="140" font-size="23" text-anchor="start" fill="#183d31"><tspan x="528" dy="0">2. Observe</tspan></text><text x="528" y="178" font-size="19" text-anchor="start" fill="#183d31"><tspan x="528" dy="0">They find the title, not the venue.</tspan></text><rect x="510" y="330" width="340" height="130" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="528" y="365" font-size="23" text-anchor="start" fill="#183d31"><tspan x="528" dy="0">3. Revise</tspan></text><text x="528" y="403" font-size="19" text-anchor="start" fill="#183d31"><tspan x="528" dy="0">Move and clarify the venue label.</tspan></text><rect x="50" y="330" width="340" height="130" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="68" y="365" font-size="23" text-anchor="start" fill="#183d31"><tspan x="68" dy="0">4. Retest</tspan></text><text x="68" y="403" font-size="19" text-anchor="start" fill="#183d31"><tspan x="68" dy="0">Repeat the task; record the result.</tspan></text><path d="M400 168H495" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><path d="M680 245V315" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 395H405" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><path d="M220 315V245" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/></g></svg>