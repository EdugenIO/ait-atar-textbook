<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Visitor access needs an enforced boundary</title><desc id="desc">Visitor and staff devices have separate routes to a policy gateway. Required internet access may be allowed, while visitor access to staff files is denied. Labels and network names alone do not implement the separation; rules and tests must enforce it.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" rx="16" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="28" text-anchor="start" fill="#183d31"><tspan x="35" dy="0">Visitor access needs an enforced boundary</tspan></text><rect x="35" y="95" width="300" height="130" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="53" y="130" font-size="23" text-anchor="start" fill="#183d31"><tspan x="53" dy="0">Staff devices</tspan></text><text x="53" y="168" font-size="19" text-anchor="start" fill="#183d31"><tspan x="53" dy="0">Authorised staff services</tspan></text><rect x="35" y="325" width="300" height="130" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="53" y="360" font-size="23" text-anchor="start" fill="#183d31"><tspan x="53" dy="0">Visitor devices</tspan></text><text x="53" y="398" font-size="19" text-anchor="start" fill="#183d31"><tspan x="53" dy="0">Guest internet access</tspan></text><rect x="395" y="210" width="230" height="115" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="413" y="245" font-size="23" text-anchor="start" fill="#183d31"><tspan x="413" dy="0">Policy gateway</tspan></text><text x="413" y="283" font-size="19" text-anchor="start" fill="#183d31"><tspan x="413" dy="0">Rules enforce access.</tspan></text><rect x="695" y="210" width="170" height="115" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="713" y="245" font-size="23" text-anchor="start" fill="#183d31"><tspan x="713" dy="0">Internet</tspan></text><text x="713" y="283" font-size="19" text-anchor="start" fill="#183d31"></text><path d="M350 155L380 240" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 385L380 300" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 267H680" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><text x="490" y="135" font-size="19" text-anchor="middle" fill="#183d31"><tspan x="490" dy="0">Visitor → staff files: DENY</tspan><tspan x="490" dy="26.599999999999998">Required internet route: ALLOW</tspan></text><text x="450" y="510" font-size="21" text-anchor="middle" fill="#183d31"><tspan x="450" dy="0">A proposal needs configuration and isolation tests.</tspan></text></g></svg>