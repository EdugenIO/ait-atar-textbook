<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Trace the impact of a new feature</title><desc id="desc">Adding an interactive map affects content, rights, time, build work and testing. These feed an agreed scope and schedule decision. Record the decision and update dependencies instead of silently dropping essential checks.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" rx="16" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="28" text-anchor="start" fill="#183d31"><tspan x="35" dy="0">Trace the impact of a new feature</tspan></text><rect x="285" y="85" width="330" height="95" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="303" y="120" font-size="23" text-anchor="start" fill="#183d31"><tspan x="303" dy="0">Request: add a map</tspan></text><text x="303" y="158" font-size="19" text-anchor="start" fill="#183d31"></text><path d="M450 190V215H160V235" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 215V235" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 215H740V235" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="250" width="250" height="100" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="53" y="285" font-size="23" text-anchor="start" fill="#183d31"><tspan x="53" dy="0">Content and rights</tspan></text><text x="53" y="323" font-size="19" text-anchor="start" fill="#183d31"></text><rect x="325" y="250" width="250" height="100" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="343" y="285" font-size="23" text-anchor="start" fill="#183d31"><tspan x="343" dy="0">Build time and tools</tspan></text><text x="343" y="323" font-size="19" text-anchor="start" fill="#183d31"></text><rect x="615" y="250" width="250" height="100" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="633" y="285" font-size="23" text-anchor="start" fill="#183d31"><tspan x="633" dy="0">Access and testing</tspan></text><text x="633" y="323" font-size="19" text-anchor="start" fill="#183d31"></text><path d="M160 360L320 410" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 360V410" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><path d="M740 360L580 410" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><rect x="240" y="425" width="420" height="90" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="258" y="460" font-size="23" text-anchor="start" fill="#183d31"><tspan x="258" dy="0">Agree scope; update the plan</tspan></text><text x="258" y="498" font-size="19" text-anchor="start" fill="#183d31"></text></g></svg>