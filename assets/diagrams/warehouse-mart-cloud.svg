<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Scope and hosting are different questions</title><desc id="desc">A two-axis matrix shows organisation-wide warehouses and subject-focused marts in both local and cloud hosting. Analytical scope is one question; hosting location is another. A mart can use a warehouse or other sources.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" rx="16" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="28" text-anchor="start" fill="#183d31"><tspan x="35" dy="0">Scope and hosting are different questions</tspan></text><text x="45" y="120" font-size="22" text-anchor="start" fill="#183d31"><tspan x="45" dy="0">Analytical scope</tspan></text><text x="355" y="105" font-size="23" text-anchor="middle" fill="#183d31"><tspan x="355" dy="0">Local hosting</tspan></text><text x="680" y="105" font-size="23" text-anchor="middle" fill="#183d31"><tspan x="680" dy="0">Cloud hosting</tspan></text><text x="45" y="235" font-size="20" text-anchor="start" fill="#183d31"><tspan x="45" dy="0">Across the</tspan><tspan x="45" dy="28.0">organisation</tspan></text><text x="45" y="385" font-size="20" text-anchor="start" fill="#183d31"><tspan x="45" dy="0">One subject or</tspan><tspan x="45" dy="28.0">department</tspan></text><rect x="220" y="165" width="270" height="125" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="238" y="200" font-size="23" text-anchor="start" fill="#183d31"><tspan x="238" dy="0">Data warehouse</tspan></text><text x="238" y="238" font-size="19" text-anchor="start" fill="#183d31"><tspan x="238" dy="0">Organisation-wide analysis.</tspan></text><rect x="545" y="165" width="310" height="125" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="563" y="200" font-size="23" text-anchor="start" fill="#183d31"><tspan x="563" dy="0">Cloud warehouse</tspan></text><text x="563" y="238" font-size="19" text-anchor="start" fill="#183d31"><tspan x="563" dy="0">Organisation-wide analysis.</tspan></text><rect x="220" y="330" width="270" height="125" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="238" y="365" font-size="23" text-anchor="start" fill="#183d31"><tspan x="238" dy="0">Data mart</tspan></text><text x="238" y="403" font-size="19" text-anchor="start" fill="#183d31"><tspan x="238" dy="0">Focused analysis.</tspan></text><rect x="545" y="330" width="310" height="125" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="563" y="365" font-size="23" text-anchor="start" fill="#183d31"><tspan x="563" dy="0">Cloud data mart</tspan></text><text x="563" y="403" font-size="19" text-anchor="start" fill="#183d31"><tspan x="563" dy="0">Focused analysis.</tspan></text><text x="450" y="510" font-size="20" text-anchor="middle" fill="#183d31"><tspan x="450" dy="0">A mart can use a warehouse or other data sources.</tspan></text></g></svg>