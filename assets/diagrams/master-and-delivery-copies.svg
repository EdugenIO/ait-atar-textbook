<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Keep the master; choose each output</title><desc id="desc">An editable master branches to an online copy and a print proof. The online copy is checked for screen dimensions, bytes and readability. The print proof is checked for physical size, pixel detail and printer requirements. Neither replaces the master.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" rx="16" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="28" text-anchor="start" fill="#183d31"><tspan x="35" dy="0">Keep the master; choose each output</tspan></text><rect x="280" y="92" width="340" height="115" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="298" y="127" font-size="23" text-anchor="start" fill="#183d31"><tspan x="298" dy="0">Editable master</tspan></text><text x="298" y="165" font-size="19" text-anchor="start" fill="#183d31"><tspan x="298" dy="0">Preserve detail and editing options.</tspan></text><path d="M365 218L225 280" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><path d="M535 218L675 280" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="300" width="380" height="165" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="58" y="335" font-size="23" text-anchor="start" fill="#183d31"><tspan x="58" dy="0">Online copy</tspan></text><text x="58" y="373" font-size="19" text-anchor="start" fill="#183d31"><tspan x="58" dy="0">Check pixels, bytes and readability.</tspan><tspan x="58" dy="26.599999999999998">Inspect on the intended screen.</tspan></text><rect x="480" y="300" width="380" height="165" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="498" y="335" font-size="23" text-anchor="start" fill="#183d31"><tspan x="498" dy="0">Print proof</tspan></text><text x="498" y="373" font-size="19" text-anchor="start" fill="#183d31"><tspan x="498" dy="0">Check physical size and detail.</tspan><tspan x="498" dy="26.599999999999998">Follow printer requirements.</tspan></text><text x="450" y="510" font-size="20" text-anchor="middle" fill="#183d31"><tspan x="450" dy="0">Changing a resolution label does not create missing detail.</tspan></text></g></svg>