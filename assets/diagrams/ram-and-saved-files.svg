<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Working memory and saved files</title><desc id="desc">A saved project is read from an SSD into RAM when opened. Edits happen in the active project. Saving writes changes back to storage. Unsaved changes are not a saved copy. This simplifies application behaviour.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" rx="16" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="28" text-anchor="start" fill="#183d31"><tspan x="35" dy="0">Working memory and saved files</tspan></text><rect x="55" y="145" width="275" height="235" rx="12" fill="#f3f6ee" stroke="#295849" stroke-width="2"/><rect x="90" y="175" width="205" height="110" rx="12" fill="white" stroke="#295849" stroke-width="2"/><text x="192" y="220" font-size="24" text-anchor="middle" fill="#183d31"><tspan x="192" dy="0">SSD</tspan><tspan x="192" dy="33.599999999999994">Saved project</tspan></text><text x="192" y="325" font-size="20" text-anchor="middle" fill="#183d31"><tspan x="192" dy="0">Keeps saved data</tspan></text><rect x="570" y="145" width="275" height="235" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><rect x="615" y="183" width="185" height="95" rx="12" fill="#d8e8dc" stroke="#295849" stroke-width="2"/><text x="707" y="218" font-size="24" text-anchor="middle" fill="#183d31"><tspan x="707" dy="0">RAM</tspan><tspan x="707" dy="33.599999999999994">Active project</tspan></text><rect x="620" y="168" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="620" y="278" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="648" y="168" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="648" y="278" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="676" y="168" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="676" y="278" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="704" y="168" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="704" y="278" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="732" y="168" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="732" y="278" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="760" y="168" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="760" y="278" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="788" y="168" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="788" y="278" width="14" height="15" rx="0" fill="#295849" stroke="#295849" stroke-width="2"/><text x="707" y="325" font-size="20" text-anchor="middle" fill="#183d31"><tspan x="707" dy="0">Working memory</tspan></text><path d="M340 205H555" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><text x="447" y="180" font-size="18" text-anchor="middle" fill="#183d31"><tspan x="447" dy="0">OPEN</tspan></text><path d="M560 300H345" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><text x="447" y="345" font-size="18" text-anchor="middle" fill="#183d31"><tspan x="447" dy="0">SAVE</tspan></text><text x="450" y="455" font-size="21" text-anchor="middle" fill="#183d31"><tspan x="450" dy="0">Unsaved changes may be lost if power fails.</tspan><tspan x="450" dy="29.4">Autosave and recovery depend on the application.</tspan></text></g></svg>