<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">One LAN: physical links and service roles</title><desc id="desc">A switch is at the centre of a physical star with links to a workstation, a printer and a file server. The workstation uses services from the server over this LAN. A star describes links; client-server describes service organisation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" rx="16" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="28" text-anchor="start" fill="#183d31"><tspan x="35" dy="0">One LAN: physical links and service roles</tspan></text><rect x="335" y="220" width="230" height="100" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="353" y="255" font-size="23" text-anchor="start" fill="#183d31"><tspan x="353" dy="0">Switch</tspan></text><text x="353" y="293" font-size="19" text-anchor="start" fill="#183d31"><tspan x="353" dy="0">Connects local devices.</tspan></text><rect x="35" y="90" width="260" height="110" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="53" y="125" font-size="23" text-anchor="start" fill="#183d31"><tspan x="53" dy="0">Workstation</tspan></text><text x="53" y="163" font-size="19" text-anchor="start" fill="#183d31"><tspan x="53" dy="0">Requests a file.</tspan></text><rect x="605" y="90" width="260" height="110" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="623" y="125" font-size="23" text-anchor="start" fill="#183d31"><tspan x="623" dy="0">File server</tspan></text><text x="623" y="163" font-size="19" text-anchor="start" fill="#183d31"><tspan x="623" dy="0">Provides shared files.</tspan></text><rect x="335" y="385" width="230" height="100" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="353" y="420" font-size="23" text-anchor="start" fill="#183d31"><tspan x="353" dy="0">Printer</tspan></text><text x="353" y="458" font-size="19" text-anchor="start" fill="#183d31"><tspan x="353" dy="0">Shared output.</tspan></text><path d="M285 190L330 235" fill="none" stroke="#295849" stroke-width="3"/><path d="M615 190L570 235" fill="none" stroke="#295849" stroke-width="3"/><path d="M450 330V372" fill="none" stroke="#295849" stroke-width="3"/><text x="450" y="105" font-size="23" text-anchor="middle" fill="#183d31"><tspan x="450" dy="0">Physical star</tspan></text><text x="450" y="515" font-size="19" text-anchor="middle" fill="#183d31"><tspan x="450" dy="0">Client → server is a service relationship.</tspan></text></g></svg>