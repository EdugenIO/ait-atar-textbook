<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">A colour scheme is not a colour profile</title><desc id="desc">One source publication has colour roles, such as heading and panel colours. Output preparation also needs appropriate profile handling. The workflow branches to a display check and to a print proof using the actual output requirements.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" rx="16" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="28" text-anchor="start" fill="#183d31"><tspan x="35" dy="0">A colour scheme is not a colour profile</tspan></text><rect x="40" y="100" width="350" height="150" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="58" y="135" font-size="23" text-anchor="start" fill="#183d31"><tspan x="58" dy="0">Scheme: roles</tspan></text><text x="58" y="173" font-size="19" text-anchor="start" fill="#183d31"><tspan x="58" dy="0">Heading colour</tspan><tspan x="58" dy="26.599999999999998">Panel colour</tspan><tspan x="58" dy="26.599999999999998">Action colour</tspan></text><rect x="420" y="115" width="60" height="60" rx="12" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="495" y="115" width="60" height="60" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><rect x="570" y="115" width="60" height="60" rx="12" fill="#6552a0" stroke="#295849" stroke-width="2"/><text x="420" y="220" font-size="19" text-anchor="start" fill="#183d31"><tspan x="420" dy="0">Colours have different jobs.</tspan></text><path d="M215 265V305" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="325" width="350" height="125" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="58" y="360" font-size="23" text-anchor="start" fill="#183d31"><tspan x="58" dy="0">Source + output settings</tspan></text><text x="58" y="398" font-size="19" text-anchor="start" fill="#183d31"><tspan x="58" dy="0">Interpret colour values correctly.</tspan></text><path d="M405 385H450V340H480" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 385V460H480" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><rect x="495" y="290" width="360" height="100" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="513" y="325" font-size="23" text-anchor="start" fill="#183d31"><tspan x="513" dy="0">Display check</tspan></text><text x="513" y="363" font-size="19" text-anchor="start" fill="#183d31"><tspan x="513" dy="0">Inspect the delivered file.</tspan></text><rect x="495" y="410" width="360" height="100" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="513" y="445" font-size="23" text-anchor="start" fill="#183d31"><tspan x="513" dy="0">Print proof</tspan></text><text x="513" y="483" font-size="19" text-anchor="start" fill="#183d31"><tspan x="513" dy="0">Use printer-supplied requirements.</tspan></text></g></svg>