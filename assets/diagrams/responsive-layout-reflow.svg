<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Reflow the layout instead of shrinking it</title><desc id="desc">A wide layout places Services and Hours side by side. A narrow layout puts Services above Hours. The reading order remains meaningful. This is a wireframe, not a claim that every real page will be accessible.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" rx="16" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="28" text-anchor="start" fill="#183d31"><tspan x="35" dy="0">Reflow the layout instead of shrinking it</tspan></text><rect x="40" y="110" width="490" height="300" rx="12" fill="white" stroke="#295849" stroke-width="2"/><rect x="65" y="135" width="440" height="40" rx="12" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="65" y="195" width="255" height="155" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="83" y="230" font-size="23" text-anchor="start" fill="#183d31"><tspan x="83" dy="0">Services</tspan></text><text x="83" y="268" font-size="19" text-anchor="start" fill="#183d31"><tspan x="83" dy="0">Repair information</tspan><tspan x="83" dy="26.599999999999998">Next action</tspan></text><rect x="340" y="195" width="165" height="155" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="358" y="230" font-size="23" text-anchor="start" fill="#183d31"><tspan x="358" dy="0">Hours</tspan></text><text x="358" y="268" font-size="19" text-anchor="start" fill="#183d31"><tspan x="358" dy="0">Open times</tspan></text><rect x="640" y="90" width="210" height="375" rx="12" fill="white" stroke="#295849" stroke-width="2"/><rect x="660" y="112" width="170" height="35" rx="12" fill="#295849" stroke="#295849" stroke-width="2"/><rect x="660" y="170" width="170" height="115" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="678" y="205" font-size="23" text-anchor="start" fill="#183d31"><tspan x="678" dy="0">Services</tspan></text><text x="678" y="243" font-size="19" text-anchor="start" fill="#183d31"><tspan x="678" dy="0">Repair details</tspan></text><rect x="660" y="305" width="170" height="115" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="678" y="340" font-size="23" text-anchor="start" fill="#183d31"><tspan x="678" dy="0">Hours</tspan></text><text x="678" y="378" font-size="19" text-anchor="start" fill="#183d31"><tspan x="678" dy="0">Open times</tspan></text><path d="M545 260H625" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><text x="285" y="455" font-size="22" text-anchor="middle" fill="#183d31"><tspan x="285" dy="0">Wide view</tspan></text><text x="745" y="505" font-size="22" text-anchor="middle" fill="#183d31"><tspan x="745" dy="0">Narrow view</tspan></text></g></svg>