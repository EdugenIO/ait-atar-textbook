<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">A valid format does not establish identity</title><desc id="desc">Browser checks can help a user correct input. Submitted data still needs receiving-side validation because browser checks can be bypassed. A format match does not prove an email address exists, belongs to the user or may be used for another purpose.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" rx="16" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="28" text-anchor="start" fill="#183d31"><tspan x="35" dy="0">A valid format does not establish identity</tspan></text><rect x="35" y="100" width="350" height="145" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="53" y="135" font-size="23" text-anchor="start" fill="#183d31"><tspan x="53" dy="0">Browser feedback</tspan></text><text x="53" y="173" font-size="19" text-anchor="start" fill="#183d31"><tspan x="53" dy="0">Check the stated input rules.</tspan><tspan x="53" dy="26.599999999999998">Help the user correct errors.</tspan></text><path d="M400 173H495" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="145" font-size="18" text-anchor="middle" fill="#183d31"><tspan x="450" dy="0">submit</tspan></text><rect x="510" y="100" width="350" height="145" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="528" y="135" font-size="23" text-anchor="start" fill="#183d31"><tspan x="528" dy="0">Receiving-side checks</tspan></text><text x="528" y="173" font-size="19" text-anchor="start" fill="#183d31"><tspan x="528" dy="0">Validate submitted data again.</tspan><tspan x="528" dy="26.599999999999998">Do not trust browser checks alone.</tspan></text><rect x="65" y="315" width="770" height="155" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="83" y="350" font-size="23" text-anchor="start" fill="#183d31"><tspan x="83" dy="0">Separate questions remain</tspan></text><text x="83" y="388" font-size="19" text-anchor="start" fill="#183d31"><tspan x="83" dy="0">Does the address exist? Does it belong to this person?</tspan><tspan x="83" dy="26.599999999999998">Do we have permission for the intended use?</tspan></text><text x="450" y="510" font-size="22" text-anchor="middle" fill="#183d31"><tspan x="450" dy="0">Rule validation ≠ proof of identity or permission</tspan></text></g></svg>