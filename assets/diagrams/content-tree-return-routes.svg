<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">A hierarchy should help readers return</title><desc id="desc">Festival home contains a Programme page, which links to Session A and Session B. Each session has time and venue information. Return links take a reader from the session to Programme and then Home.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" rx="16" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="28" text-anchor="start" fill="#183d31"><tspan x="35" dy="0">A hierarchy should help readers return</tspan></text><rect x="295" y="90" width="310" height="90" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="313" y="125" font-size="23" text-anchor="start" fill="#183d31"><tspan x="313" dy="0">Festival home</tspan></text><text x="313" y="163" font-size="19" text-anchor="start" fill="#183d31"></text><rect x="295" y="240" width="310" height="90" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="313" y="275" font-size="23" text-anchor="start" fill="#183d31"><tspan x="313" dy="0">Programme</tspan></text><text x="313" y="313" font-size="19" text-anchor="start" fill="#183d31"></text><rect x="65" y="395" width="310" height="100" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="83" y="430" font-size="23" text-anchor="start" fill="#183d31"><tspan x="83" dy="0">Session A</tspan></text><text x="83" y="468" font-size="19" text-anchor="start" fill="#183d31"><tspan x="83" dy="0">Time and venue</tspan></text><rect x="525" y="395" width="310" height="100" rx="12" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="543" y="430" font-size="23" text-anchor="start" fill="#183d31"><tspan x="543" dy="0">Session B</tspan></text><text x="543" y="468" font-size="19" text-anchor="start" fill="#183d31"><tspan x="543" dy="0">Time and venue</tspan></text><path d="M450 190V225" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><path d="M390 340L230 380" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><path d="M510 340L670 380" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="225" font-size="18" text-anchor="start" fill="#183d31"><tspan x="45" dy="0">Return routes:</tspan><tspan x="45" dy="25.2">Session → Programme</tspan><tspan x="45" dy="25.2">Programme → Home</tspan></text></g></svg>