<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Follow a lookup across one row</title><desc id="desc">The selected worksheet range is A2:C4. Code A02 is in row 3. Follow that row to column C, the third column of the range, to return quantity 8. The header row is not included in the range.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" rx="16" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="28" text-anchor="start" fill="#183d31"><tspan x="35" dy="0">Follow a lookup across one row</tspan></text><rect x="70" y="115" width="55" height="55" rx="0" fill="#f6f8f2" stroke="#82968a" stroke-width="2"/><rect x="125" y="115" width="225" height="55" rx="0" fill="#f6f8f2" stroke="#82968a" stroke-width="2"/><rect x="350" y="115" width="240" height="55" rx="0" fill="#f6f8f2" stroke="#82968a" stroke-width="2"/><rect x="590" y="115" width="230" height="55" rx="0" fill="#f6f8f2" stroke="#82968a" stroke-width="2"/><rect x="70" y="170" width="55" height="70" rx="0" fill="#f6f8f2" stroke="#82968a" stroke-width="2"/><rect x="125" y="170" width="225" height="70" rx="0" fill="#f6f8f2" stroke="#82968a" stroke-width="2"/><rect x="350" y="170" width="240" height="70" rx="0" fill="#f6f8f2" stroke="#82968a" stroke-width="2"/><rect x="590" y="170" width="230" height="70" rx="0" fill="#f6f8f2" stroke="#82968a" stroke-width="2"/><rect x="70" y="240" width="55" height="70" rx="0" fill="#d8e8dc" stroke="#82968a" stroke-width="2"/><rect x="125" y="240" width="225" height="70" rx="0" fill="#d8e8dc" stroke="#82968a" stroke-width="2"/><rect x="350" y="240" width="240" height="70" rx="0" fill="#d8e8dc" stroke="#82968a" stroke-width="2"/><rect x="590" y="240" width="230" height="70" rx="0" fill="#d8e8dc" stroke="#82968a" stroke-width="2"/><rect x="70" y="310" width="55" height="70" rx="0" fill="#f6f8f2" stroke="#82968a" stroke-width="2"/><rect x="125" y="310" width="225" height="70" rx="0" fill="#f6f8f2" stroke="#82968a" stroke-width="2"/><rect x="350" y="310" width="240" height="70" rx="0" fill="#f6f8f2" stroke="#82968a" stroke-width="2"/><rect x="590" y="310" width="230" height="70" rx="0" fill="#f6f8f2" stroke="#82968a" stroke-width="2"/><text x="82" y="150" font-size="18" text-anchor="start" fill="#183d31"><tspan x="82" dy="0">Row</tspan></text><text x="137" y="150" font-size="18" text-anchor="start" fill="#183d31"><tspan x="137" dy="0">A: Code</tspan></text><text x="362" y="150" font-size="18" text-anchor="start" fill="#183d31"><tspan x="362" dy="0">B: Asset</tspan></text><text x="602" y="150" font-size="18" text-anchor="start" fill="#183d31"><tspan x="602" dy="0">C: Quantity</tspan></text><text x="84" y="214" font-size="23" text-anchor="start" fill="#183d31"><tspan x="84" dy="0">2</tspan></text><text x="139" y="214" font-size="23" text-anchor="start" fill="#183d31"><tspan x="139" dy="0">P01</tspan></text><text x="364" y="214" font-size="23" text-anchor="start" fill="#183d31"><tspan x="364" dy="0">Poster</tspan></text><text x="604" y="214" font-size="23" text-anchor="start" fill="#183d31"><tspan x="604" dy="0">12</tspan></text><text x="84" y="284" font-size="23" text-anchor="start" fill="#183d31"><tspan x="84" dy="0">3</tspan></text><text x="139" y="284" font-size="23" text-anchor="start" fill="#183d31"><tspan x="139" dy="0">A02</tspan></text><text x="364" y="284" font-size="23" text-anchor="start" fill="#183d31"><tspan x="364" dy="0">Audio</tspan></text><text x="604" y="284" font-size="23" text-anchor="start" fill="#183d31"><tspan x="604" dy="0">8</tspan></text><text x="84" y="354" font-size="23" text-anchor="start" fill="#183d31"><tspan x="84" dy="0">4</tspan></text><text x="139" y="354" font-size="23" text-anchor="start" fill="#183d31"><tspan x="139" dy="0">V03</tspan></text><text x="364" y="354" font-size="23" text-anchor="start" fill="#183d31"><tspan x="364" dy="0">Video</tspan></text><text x="604" y="354" font-size="23" text-anchor="start" fill="#183d31"><tspan x="604" dy="0">30</tspan></text><path d="M235 265H640" fill="none" stroke="#295849" stroke-width="3" marker-end="url(#arrow)"/><text x="445" y="255" font-size="18" text-anchor="middle" fill="#183d31"><tspan x="445" dy="0">stay on the matching row</tspan></text><text x="70" y="430" font-size="24" text-anchor="start" fill="#183d31"><tspan x="70" dy="0">=VLOOKUP(&quot;A02&quot;, A2:C4, 3, FALSE)</tspan></text><text x="70" y="478" font-size="21" text-anchor="start" fill="#183d31"><tspan x="70" dy="0">Find A02 in column A. Return column 3 of the range: 8.</tspan></text></g></svg>