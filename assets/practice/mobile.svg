<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Mobile poster to revise</title><desc id="desc">A narrow poster has centred paragraphs with tight line spacing and a small venue label.</desc><defs><radialGradient id="sphere" cx="30%" cy="25%"><stop stop-color="#f0faff"/><stop offset="1" stop-color="#185a87"/></radialGradient><pattern id="photo" width="45" height="40" patternUnits="userSpaceOnUse"><rect width="45" height="40" fill="#b8c5a1"/><path d="M0 40L20 3 45 40" fill="#627b50"/><path d="M0 10L45 30" stroke="#f3db8b" stroke-width="8"/></pattern></defs><rect width="800" height="460" fill="#f3f7fb"/><g font-family="Arial,sans-serif" fill="#172d42"><text x="24" y="34" font-size="24" >Mobile poster to revise</text><rect x="230" y="60" width="340" height="370" rx="8" fill="#fff" stroke="#354d64"/><text x="400" y="105" font-size="24" text-anchor="middle" font-weight="bold">AFTER SCHOOL ART</text><text x="400" y="155" font-size="18" text-anchor="middle">Join us for an afternoon</text><text x="400" y="174" font-size="18" text-anchor="middle">of drawing and making.</text><text x="400" y="193" font-size="18" text-anchor="middle">Bring a friend and try</text><text x="400" y="212" font-size="18" text-anchor="middle">a new creative activity.</text><text x="400" y="231" font-size="18" text-anchor="middle">All materials supplied.</text><text x="400" y="295" font-size="24" text-anchor="middle">Friday · 4 pm</text><text x="400" y="325" font-size="11" text-anchor="middle">Venue: school hall</text><text x="400" y="375" font-size="20" text-anchor="middle">Book at the library</text></g></svg>