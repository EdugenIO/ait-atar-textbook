<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Typography gives information different jobs</title><desc id="desc">A workshop notice uses a large bold title, a medium date and venue, and a distinct booking instruction. Lines connect each to its role.</desc><rect width="900" height="540" fill="#f3f7f5"/><g font-family="Arial,sans-serif" fill="#183d31"><text x="28" y="38" font-size="26" >Typography gives information different jobs</text><rect x="35" y="75" width="470" height="420" rx="8" fill="white" stroke="#295849"/><text x="65" y="145" font-size="32" font-weight="bold">MAKE SOMETHING</text><text x="65" y="190" font-size="23" >Saturday art workshop</text><text x="65" y="275" font-size="26" >Saturday · 10 am</text><text x="65" y="315" font-size="26" >Hall 2</text><rect x="65" y="365" width="390" height="65" rx="8" fill="white" stroke="#295849"/><text x="85" y="405" font-size="26" >Book at the library</text><text x="610" y="145" font-size="22" >What is the event?</text><text x="610" y="280" font-size="22" >When and where?</text><text x="610" y="405" font-size="22" >What do I do next?</text><path d="M470 135H590M470 285H590M470 395H590" stroke="#287b70" stroke-width="2"/><text x="40" y="525" font-size="21" >Size, weight and spacing signal roles; check them at the delivery size.</text></g></svg>