<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Sports notice to revise</title><desc id="desc">A textured background sits behind the club name and the small message Training moved to Court 2.</desc><defs><radialGradient id="sphere" cx="30%" cy="25%"><stop stop-color="#f0faff"/><stop offset="1" stop-color="#185a87"/></radialGradient><pattern id="photo" width="45" height="40" patternUnits="userSpaceOnUse"><rect width="45" height="40" fill="#b8c5a1"/><path d="M0 40L20 3 45 40" fill="#627b50"/><path d="M0 10L45 30" stroke="#f3db8b" stroke-width="8"/></pattern></defs><rect width="800" height="460" fill="#f3f7fb"/><g font-family="Arial,sans-serif" fill="#172d42"><text x="24" y="34" font-size="24" >Sports notice to revise</text><rect x="160" y="65" width="480" height="360" rx="8" fill="#fff" stroke="#354d64"/><rect x="175" y="80" width="450" height="330" fill="url(#photo)"/><text x="200" y="160" font-size="38" font-weight="bold">SPORTS CLUB</text><text x="430" y="310" font-size="12" >Training moved to Court 2</text></g></svg>