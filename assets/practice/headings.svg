<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Six headings on one poster</title><desc id="desc">Six headings have the same size, weight and coloured background.</desc><defs><radialGradient id="sphere" cx="30%" cy="25%"><stop stop-color="#f0faff"/><stop offset="1" stop-color="#185a87"/></radialGradient><pattern id="photo" width="45" height="40" patternUnits="userSpaceOnUse"><rect width="45" height="40" fill="#b8c5a1"/><path d="M0 40L20 3 45 40" fill="#627b50"/><path d="M0 10L45 30" stroke="#f3db8b" stroke-width="8"/></pattern></defs><rect width="800" height="460" fill="#f3f7fb"/><g font-family="Arial,sans-serif" fill="#172d42"><text x="24" y="34" font-size="24" >Six headings on one poster</text><rect x="110" y="65" width="580" height="360" rx="8" fill="#fff" stroke="#354d64"/><rect x="145" y="95" width="240" height="70" rx="8" fill="#d6e8f5" stroke="#354d64"/><text x="160" y="138" font-size="24" font-weight="bold">ART SHOW</text><rect x="410" y="95" width="240" height="70" rx="8" fill="#d6e8f5" stroke="#354d64"/><text x="425" y="138" font-size="24" font-weight="bold">FRIDAY</text><rect x="145" y="195" width="240" height="70" rx="8" fill="#d6e8f5" stroke="#354d64"/><text x="160" y="238" font-size="24" font-weight="bold">WORKSHOPS</text><rect x="410" y="195" width="240" height="70" rx="8" fill="#d6e8f5" stroke="#354d64"/><text x="425" y="238" font-size="24" font-weight="bold">4 PM</text><rect x="145" y="295" width="240" height="70" rx="8" fill="#d6e8f5" stroke="#354d64"/><text x="160" y="338" font-size="24" font-weight="bold">SCHOOL HALL</text><rect x="410" y="295" width="240" height="70" rx="8" fill="#d6e8f5" stroke="#354d64"/><text x="425" y="338" font-size="24" font-weight="bold">FREE ENTRY</text></g></svg>