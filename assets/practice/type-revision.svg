<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Show the change and explain its purpose</title><desc id="desc">Two notices keep the same words. In A the venue is small and distant from the date. In B it is larger and grouped with the date. A note asks for a reader test.</desc><rect width="900" height="540" fill="#f3f7f5"/><g font-family="Arial,sans-serif" fill="#183d31"><text x="28" y="38" font-size="26" >Show the change and explain its purpose</text><text x="45" y="85" font-size="22" >A · First draft</text><text x="490" y="85" font-size="22" >B · Revised draft</text><rect x="40" y="100" width="370" height="320" rx="8" fill="white" stroke="#295849"/><rect x="490" y="100" width="370" height="320" rx="8" fill="white" stroke="#295849"/><text x="65" y="155" font-size="30" >REPAIR CAFÉ</text><text x="515" y="155" font-size="30" >REPAIR CAFÉ</text><text x="65" y="215" font-size="23" >Saturday · 10 am</text><text x="515" y="215" font-size="23" >Saturday · 10 am</text><text x="515" y="252" font-size="25" >Venue: Hall 2</text><text x="65" y="280" font-size="21" >Bring a small item</text><text x="515" y="315" font-size="21" >Bring a small item</text><text x="65" y="385" font-size="12" >Venue: Hall 2</text><text x="40" y="465" font-size="22" >Change: enlarge the venue and group it with the time.</text><text x="40" y="500" font-size="22" >Check: ask a reader to find the venue; record what happens.</text></g></svg>