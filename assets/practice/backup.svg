<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Incremental backup chain</title><desc id="desc">Sunday full backup F is followed by Monday increment I1 and Tuesday increment I2. Arrows connect F to I1 to I2.</desc><defs><radialGradient id="sphere" cx="30%" cy="25%"><stop stop-color="#f0faff"/><stop offset="1" stop-color="#185a87"/></radialGradient><pattern id="photo" width="45" height="40" patternUnits="userSpaceOnUse"><rect width="45" height="40" fill="#b8c5a1"/><path d="M0 40L20 3 45 40" fill="#627b50"/><path d="M0 10L45 30" stroke="#f3db8b" stroke-width="8"/></pattern></defs><rect width="800" height="460" fill="#f3f7fb"/><g font-family="Arial,sans-serif" fill="#172d42"><text x="24" y="34" font-size="24" >Incremental backup chain</text><rect x="40" y="160" width="200" height="150" rx="8" fill="#d6e8f5" stroke="#354d64"/><text x="65" y="205" font-size="23" >Sunday</text><text x="65" y="260" font-size="30" >F</text><rect x="300" y="160" width="200" height="150" rx="8" fill="#d6e8f5" stroke="#354d64"/><text x="325" y="205" font-size="23" >Monday</text><text x="325" y="260" font-size="30" >I1</text><rect x="560" y="160" width="200" height="150" rx="8" fill="#d6e8f5" stroke="#354d64"/><text x="585" y="205" font-size="23" >Tuesday</text><text x="585" y="260" font-size="30" >I2</text><path d="M242 235H295L283 225M295 235L283 245M502 235H555L543 225M555 235L543 245" fill="none" stroke="#354d64" stroke-width="3"/></g></svg>