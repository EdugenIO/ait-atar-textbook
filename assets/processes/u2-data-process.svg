<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Crop content or resample pixel dimensions</title><desc id="desc">One master image branches to a crop that removes an outer portion and a resampled copy that preserves the whole scene with fewer pixels. The captions separate content loss from changing dimensions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Crop content or resample pixel dimensions</text><rect x="45" y="135" width="255" height="170" rx="10" fill="#dce8dc" stroke="#254b40" stroke-width="2"/><circle cx="100" cy="175" r="21" fill="#af742b"/><path d="M55 285L140 200L205 250L290 180V295H55Z" fill="#7b648a"/><path d="M105 145H245V270H105Z" fill="none" stroke="#af742b" stroke-width="3" stroke-dasharray="6 5"/><text x="50" y="115" fill="#254b40" font-size="22">Master: preserve source</text><path d="M315 180L465 135" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><path d="M315 240L465 290" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="80" width="290" height="140" rx="10" fill="#dce8dc" stroke="#254b40" stroke-width="2"/><path d="M495 205L585 120L650 170L765 100V210H495Z" fill="#7b648a"/><text x="495" y="250" fill="#254b40" font-size="20">Crop: change the included area</text><rect x="490" y="285" width="145" height="95" rx="10" fill="#dce8dc" stroke="#254b40" stroke-width="2"/><circle cx="520" cy="310" r="12" fill="#af742b"/><path d="M495 370L545 325L585 350L630 310V375H495Z" fill="#7b648a"/><text x="660" y="320" fill="#254b40" font-size="21">Resample:</text><text x="660" y="350" fill="#254b40" font-size="21">fewer pixels</text></g></svg>