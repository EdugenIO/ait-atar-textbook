<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Compare field use with production work</title><desc id="desc">A tablet for a walking volunteer is contrasted with a desktop editing station. Two columns show different usability requirements, and an unknown runtime is explicitly retained as an evidence gap.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Compare field use with production work</text><rect x="100" y="105" width="155" height="200" rx="10" fill="#254b40" stroke="#254b40" stroke-width="2"/><rect x="115" y="125" width="125" height="155" rx="10" fill="#f6ecd5" stroke="#254b40" stroke-width="2"/><circle cx="178" cy="295" r="5" fill="white"/><rect x="505" y="105" width="300" height="165" rx="10" fill="#254b40" stroke="#254b40" stroke-width="2"/><rect x="520" y="120" width="270" height="130" rx="10" fill="#dce8dc" stroke="#254b40" stroke-width="2"/><path d="M655 270V310 M585 310H725" fill="none" stroke="#254b40" stroke-width="3" /><text x="55" y="350" fill="#254b40" font-size="22">Field: portable, readable, offline</text><text x="485" y="350" fill="#254b40" font-size="22">Production: editor, input, workspace</text><text x="60" y="390" fill="#254b40" font-size="20">Runtime unknown? Keep it unverified.</text><text x="490" y="390" fill="#254b40" font-size="19">More RAM does not fix app incompatibility.</text></g></svg>