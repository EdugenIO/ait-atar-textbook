<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Use a publishing workflow and an internationalised page</title><desc id="desc">A CMS state board moves a draft through review to publication, alongside a page specimen using a clear written date, declared language and meaningful heading structure. The two halves distinguish approval from markup.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Use a publishing workflow and an internationalised page</text><rect x="35" y="95" width="250" height="90" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="53" y="128" fill="#254b40" font-size="23">Draft</text><text x="53" y="165" fill="#254b40" font-size="18">Volunteer proposes</text><rect x="35" y="210" width="250" height="90" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="53" y="243" fill="#254b40" font-size="23">Review</text><text x="53" y="280" fill="#254b40" font-size="18">Editor checks evidence</text><rect x="35" y="325" width="250" height="65" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="53" y="358" fill="#254b40" font-size="23">Publish</text><path d="M160 185L160 207" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><path d="M160 300L160 322" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><rect x="380" y="95" width="470" height="285" rx="10" fill="white" stroke="#254b40" stroke-width="2"/><text x="405" y="140" fill="#254b40" font-size="30">Workshop information</text><text x="405" y="190" fill="#254b40" font-size="27">4 May 2027</text><text x="405" y="230" fill="#254b40" font-size="21">Document language: en-AU</text><text x="405" y="275" fill="#254b40" font-size="21">Heading → date → details</text><text x="405" y="325" fill="#254b40" font-size="21">Labels and recovery help</text></g></svg>