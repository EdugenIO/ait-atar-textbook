<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Check people as well as Gantt bars</title><desc id="desc">A six-day Gantt-style plan shows prototype and asset work in parallel with two separate people, followed by dependent build, test and retest stages. A note identifies the one-person scheduling conflict.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Check people as well as Gantt bars</text><text x="290" y="105" fill="#254b40" font-size="20">D1</text><text x="380" y="105" fill="#254b40" font-size="20">D2</text><text x="470" y="105" fill="#254b40" font-size="20">D3</text><text x="560" y="105" fill="#254b40" font-size="20">D4</text><text x="650" y="105" fill="#254b40" font-size="20">D5</text><text x="740" y="105" fill="#254b40" font-size="20">D6</text><text x="35" y="150" fill="#254b40" font-size="21">Brief</text><text x="35" y="193" fill="#254b40" font-size="21">Prototype · A</text><text x="35" y="236" fill="#254b40" font-size="21">Assets · B</text><text x="35" y="279" fill="#254b40" font-size="21">Build</text><text x="35" y="322" fill="#254b40" font-size="21">Test / revise</text><rect x="280" y="125" width="70" height="28" rx="10" fill="#254b40" stroke="#254b40" stroke-width="2"/><rect x="370" y="168" width="70" height="28" rx="10" fill="#7b648a" stroke="#254b40" stroke-width="2"/><rect x="370" y="211" width="70" height="28" rx="10" fill="#af742b" stroke="#254b40" stroke-width="2"/><rect x="460" y="254" width="160" height="28" rx="10" fill="#254b40" stroke="#254b40" stroke-width="2"/><rect x="640" y="297" width="160" height="28" rx="10" fill="#7b648a" stroke="#254b40" stroke-width="2"/><path d="M440 182L455 254 M440 225L455 254" fill="none" stroke="#254b40" stroke-width="3" /><text x="60" y="380" fill="#254b40" font-size="22">If A and B are one person, review the parallel full-day allocation.</text></g></svg>