<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Match interface hierarchy and help to the task</title><desc id="desc">A festival interface groups Programme above two session choices and places help beside the task. The right column distinguishes the navigation label, keyboard focus and context-specific guidance.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Match interface hierarchy and help to the task</text><rect x="50" y="85" width="470" height="290" rx="10" fill="white" stroke="#254b40" stroke-width="2"/><text x="80" y="130" fill="#254b40" font-size="31">Festival programme</text><rect x="80" y="165" width="400" height="60" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="100" y="205" fill="#254b40" font-size="24">Printmaking · Studio 1</text><rect x="80" y="245" width="400" height="60" rx="10" fill="#f6ecd5" stroke="#af742b" stroke-width="2"/><text x="100" y="285" fill="#254b40" font-size="24">Photography · Studio 2</text><text x="82" y="345" fill="#254b40" font-size="21">Help finding a session</text><path d="M74 239H486V311H74Z" fill="none" stroke="#7b648a" stroke-width="3" stroke-dasharray="5 4"/><text x="580" y="140" fill="#254b40" font-size="23">Clear destination labels</text><text x="580" y="205" fill="#254b40" font-size="23">Visible focus location</text><text x="580" y="280" fill="#254b40" font-size="23">Help beside the task</text><path d="M570 215L525 270" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/></g></svg>