<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Turn a criterion into a checked revision</title><desc id="desc">Two poster drafts are paired with a criterion requiring the venue beside the time. In the first, the venue is detached; in the revision the two details are grouped. A retest record remains blank.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Turn a criterion into a checked revision</text><rect x="45" y="85" width="350" height="245" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="63" y="118" fill="#254b40" font-size="23">Before: detached venue</text><text x="70" y="155" fill="#254b40" font-size="28">REPAIR CAFÉ</text><text x="70" y="205" fill="#254b40" font-size="24">10 am</text><text x="230" y="295" fill="#254b40" font-size="18">Hall 2</text><rect x="495" y="85" width="350" height="245" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="513" y="118" fill="#254b40" font-size="23">Revision: group details</text><text x="520" y="155" fill="#254b40" font-size="28">REPAIR CAFÉ</text><rect x="515" y="180" width="305" height="85" rx="10" fill="#f6ecd5" stroke="#af742b" stroke-width="2"/><text x="535" y="215" fill="#254b40" font-size="26">10 am · Hall 2</text><path d="M410 210L480 210" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><rect x="130" y="350" width="640" height="46" rx="10" fill="white" stroke="#254b40" stroke-width="2"/><text x="150" y="381" fill="#254b40" font-size="21">Retest: actual observation __________________</text></g></svg>