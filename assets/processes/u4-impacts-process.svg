<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Ask four different cloud questions</title><desc id="desc">Four quadrants distinguish confidentiality, document sensitivity, accessibility and availability. Each has a different question, preventing online availability from being confused with usable authorised access.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Ask four different cloud questions</text><rect x="45" y="95" width="380" height="125" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="63" y="128" fill="#254b40" font-size="23">Confidentiality</text><text x="63" y="165" fill="#254b40" font-size="18">Who may read this?</text><rect x="475" y="95" width="380" height="125" rx="10" fill="#f6ecd5" stroke="#254b40" stroke-width="2"/><text x="493" y="128" fill="#254b40" font-size="23">Sensitivity</text><text x="493" y="165" fill="#254b40" font-size="18">What harm could disclosure cause?</text><rect x="45" y="255" width="380" height="125" rx="10" fill="#eae3ef" stroke="#254b40" stroke-width="2"/><text x="63" y="288" fill="#254b40" font-size="23">Accessibility</text><text x="63" y="325" fill="#254b40" font-size="18">Can authorised people use it?</text><rect x="475" y="255" width="380" height="125" rx="10" fill="#e2eaf0" stroke="#254b40" stroke-width="2"/><text x="493" y="288" fill="#254b40" font-size="23">Availability</text><text x="493" y="325" fill="#254b40" font-size="18">Is the service reachable when needed?</text></g></svg>