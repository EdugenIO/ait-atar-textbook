<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Keep access, reuse and publication separate</title><desc id="desc">Three document folders represent an FOI access decision, permission for reusing an asset and the review of a publication claim. Separate review markers show that one decision does not clear the other two.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Keep access, reuse and publication separate</text><rect x="50" y="135" width="220" height="180" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><rect x="65" y="110" width="110" height="35" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><rect x="350" y="135" width="220" height="180" rx="10" fill="#f6ecd5" stroke="#254b40" stroke-width="2"/><rect x="365" y="110" width="110" height="35" rx="10" fill="#f6ecd5" stroke="#254b40" stroke-width="2"/><rect x="650" y="135" width="220" height="180" rx="10" fill="#eae3ef" stroke="#254b40" stroke-width="2"/><rect x="665" y="110" width="110" height="35" rx="10" fill="#eae3ef" stroke="#254b40" stroke-width="2"/><text x="75" y="185" fill="#254b40" font-size="28">Access</text><text x="75" y="230" fill="#254b40" font-size="19">Which documents?</text><text x="75" y="270" fill="#254b40" font-size="19">Which limits?</text><text x="375" y="185" fill="#254b40" font-size="28">Reuse</text><text x="375" y="230" fill="#254b40" font-size="19">Which asset/use?</text><text x="375" y="270" fill="#254b40" font-size="19">Which terms?</text><text x="675" y="185" fill="#254b40" font-size="28">Publication</text><text x="675" y="230" fill="#254b40" font-size="19">Which claims?</text><text x="675" y="270" fill="#254b40" font-size="19">Which checks?</text><text x="110" y="375" fill="#254b40" font-size="22">Access approval does not automatically settle reuse or publication.</text></g></svg>