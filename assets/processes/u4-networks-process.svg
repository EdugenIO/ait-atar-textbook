<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Show the intended staff and visitor boundaries</title><desc id="desc">A router/firewall divides a proposed staff branch with file services from a visitor internet branch. The visitor-to-staff path is marked as denied by intended policy, explicitly requiring configuration and testing.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Show the intended staff and visitor boundaries</text><rect x="315" y="85" width="270" height="90" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="333" y="118" fill="#254b40" font-size="23">Router / firewall</text><text x="333" y="155" fill="#254b40" font-size="18">Boundary rules</text><rect x="65" y="245" width="300" height="110" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="83" y="278" fill="#254b40" font-size="23">Staff network</text><text x="83" y="315" fill="#254b40" font-size="18">Files and shared printer</text><rect x="545" y="245" width="300" height="110" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="563" y="278" fill="#254b40" font-size="23">Visitor network</text><text x="563" y="315" fill="#254b40" font-size="18">Intended internet access</text><path d="M375 175L215 245" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><path d="M525 175L695 245" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><path d="M545 310H365" fill="none" stroke="#af742b" stroke-width="3" stroke-dasharray="6 5"/><path d="M440 290L470 330 M470 290L440 330" fill="none" stroke="#af742b" stroke-width="3" /><text x="380" y="280" fill="#254b40" font-size="18">Deny staff access</text><text x="70" y="395" fill="#254b40" font-size="22">Policy, configuration and observed results are separate evidence.</text></g></svg>