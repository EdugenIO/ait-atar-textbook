<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Make the type hierarchy visible</title><desc id="desc">An editable-style poster uses a large event heading, grouped time and venue, and a contrasting action label aligned to one left edge. Side annotations identify hierarchy, alignment and spacing.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Make the type hierarchy visible</text><rect x="65" y="85" width="470" height="280" rx="10" fill="#fffdf7" stroke="#254b40" stroke-width="2"/><path d="M95 100V345" fill="none" stroke="#af742b" stroke-width="3" stroke-dasharray="4 5"/><text x="115" y="145" fill="#254b40" font-size="39">REPAIR CAFÉ</text><text x="115" y="192" fill="#254b40" font-size="25">Saturday · 10 am</text><text x="115" y="226" fill="#254b40" font-size="25">Community hall</text><rect x="115" y="265" width="290" height="55" rx="10" fill="#254b40" stroke="#254b40" stroke-width="2"/><text x="135" y="301" fill="white" font-size="23">Bring a small item</text><text x="590" y="135" fill="#254b40" font-size="21">1  Heading has priority</text><path d="M580 145L525 145" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="215" fill="#254b40" font-size="21">2  Details stay grouped</text><path d="M580 225L525 225" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="300" fill="#254b40" font-size="21">3  Action is distinct</text><path d="M580 310L525 310" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/></g></svg>