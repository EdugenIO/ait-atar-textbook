<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Follow a booking record through its life</title><desc id="desc">Four different visual stations show a minimal booking form, authorised staff access, a dated retention decision and approved disposal across copies. Arrows connect the stages, with no claim of automatic legal compliance.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Follow a booking record through its life</text><rect x="30" y="110" width="190" height="220" rx="10" fill="#eef1e4" stroke="#254b40" stroke-width="2"/><text x="48" y="143" fill="#254b40" font-size="23">Collect</text><text x="48" y="180" fill="#254b40" font-size="18">Item</text><text x="48" y="209" fill="#254b40" font-size="18">Contact method</text><text x="48" y="238" fill="#254b40" font-size="18">Purpose</text><rect x="250" y="110" width="190" height="220" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="268" y="143" fill="#254b40" font-size="23">Use / access</text><text x="268" y="180" fill="#254b40" font-size="18">Booking team</text><text x="268" y="209" fill="#254b40" font-size="18">Approved use</text><text x="268" y="238" fill="#254b40" font-size="18">Access review</text><rect x="470" y="110" width="190" height="220" rx="10" fill="#f6ecd5" stroke="#254b40" stroke-width="2"/><text x="488" y="143" fill="#254b40" font-size="23">Retain</text><text x="488" y="180" fill="#254b40" font-size="18">Review date</text><text x="488" y="209" fill="#254b40" font-size="18">Reason</text><text x="488" y="238" fill="#254b40" font-size="18">Backup copies</text><rect x="690" y="110" width="180" height="220" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="708" y="143" fill="#254b40" font-size="23">Dispose</text><text x="708" y="180" fill="#254b40" font-size="18">Approved</text><text x="708" y="209" fill="#254b40" font-size="18">method</text><text x="708" y="238" fill="#254b40" font-size="18">Check copies</text><path d="M223 220L245 220" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><path d="M443 220L465 220" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><path d="M663 220L685 220" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><text x="75" y="380" fill="#254b40" font-size="22">A visible shortcut is not the same as every retained copy.</text></g></svg>