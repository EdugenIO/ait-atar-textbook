<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Compare two kinds of visual balance</title><desc id="desc">Two compositions contrast mirrored equal shapes with one large shape counterbalanced by three smaller circles. A separate lower arrow shows a possible reading sequence, not an observed eye path.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Compare two kinds of visual balance</text><text x="60" y="100" fill="#254b40" font-size="23">Symmetrical</text><text x="490" y="100" fill="#254b40" font-size="23">Asymmetrical</text><path d="M240 120V300 M680 120V300" fill="none" stroke="#b3b7a7" stroke-width="3" stroke-dasharray="6 6"/><rect x="100" y="165" width="85" height="110" rx="10" fill="#254b40" stroke="#254b40" stroke-width="2"/><rect x="295" y="165" width="85" height="110" rx="10" fill="#254b40" stroke="#254b40" stroke-width="2"/><rect x="490" y="145" width="130" height="140" rx="10" fill="#254b40" stroke="#254b40" stroke-width="2"/><circle cx="730" cy="170" r="25" fill="#7b648a"/><circle cx="790" cy="215" r="25" fill="#7b648a"/><circle cx="730" cy="260" r="25" fill="#7b648a"/><path d="M115 335L365 335" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><text x="115" y="370" fill="#254b40" font-size="18">Intent: heading → date → action</text><text x="490" y="365" fill="#254b40" font-size="18">Different objects can counterbalance.</text></g></svg>