<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Set frames or calculate intermediate motion</title><desc id="desc">Two animation lanes compare three explicitly positioned frames with a start/end tween and a dashed intermediate position. A separate replay control is drawn as a proposed interactive function.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Set frames or calculate intermediate motion</text><text x="40" y="105" fill="#254b40" font-size="23">Frame-by-frame</text><rect x="70" y="130" width="180" height="95" rx="10" fill="white" stroke="#254b40" stroke-width="2"/><circle cx="105" cy="178" r="18" fill="#254b40"/><text x="70" y="255" fill="#254b40" font-size="19">Frame 1</text><rect x="300" y="130" width="180" height="95" rx="10" fill="white" stroke="#254b40" stroke-width="2"/><circle cx="385" cy="178" r="18" fill="#254b40"/><text x="300" y="255" fill="#254b40" font-size="19">Frame 2</text><rect x="530" y="130" width="180" height="95" rx="10" fill="white" stroke="#254b40" stroke-width="2"/><circle cx="665" cy="178" r="18" fill="#254b40"/><text x="530" y="255" fill="#254b40" font-size="19">Frame 3</text><text x="40" y="295" fill="#254b40" font-size="23">Tween: start and end states</text><path d="M90 345H705" fill="none" stroke="#7b648a" stroke-width="3" stroke-dasharray="6 6"/><circle cx="90" cy="345" r="18" fill="#254b40"/><circle cx="395" cy="345" r="18" fill="none" stroke="#7b648a" stroke-width="3" stroke-dasharray="5 4"/><circle cx="705" cy="345" r="18" fill="#254b40"/><rect x="750" y="130" width="120" height="70" rx="10" fill="#f6ecd5" stroke="#af742b" stroke-width="2"/><text x="765" y="173" fill="#254b40" font-size="22">Replay</text><text x="750" y="242" fill="#254b40" font-size="17">Action needs</text><text x="750" y="268" fill="#254b40" font-size="17">a real test.</text></g></svg>