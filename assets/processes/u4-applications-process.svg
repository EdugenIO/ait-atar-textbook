<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Explain, demonstrate, let the learner try</title><desc id="desc">A tutorial storyboard shows an explanation, a demonstration and an independent attempt with feedback and a retry route. A separate response boundary distinguishes local preview from received online data.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Explain, demonstrate, let the learner try</text><rect x="35" y="110" width="240" height="155" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="53" y="143" fill="#254b40" font-size="23">Explain</text><text x="53" y="180" fill="#254b40" font-size="18">Task and purpose</text><text x="53" y="209" fill="#254b40" font-size="18">Text alternative</text><rect x="330" y="110" width="240" height="155" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="348" y="143" fill="#254b40" font-size="23">Show</text><text x="348" y="180" fill="#254b40" font-size="18">Worked steps</text><text x="348" y="209" fill="#254b40" font-size="18">Learner controls</text><rect x="625" y="110" width="240" height="155" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="643" y="143" fill="#254b40" font-size="23">Try / review</text><text x="643" y="180" fill="#254b40" font-size="18">Equivalent task</text><text x="643" y="209" fill="#254b40" font-size="18">Feedback and retry</text><path d="M275 190L325 190" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><path d="M570 190L620 190" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 270V300H450V270" fill="none" stroke="#7b648a" stroke-width="3" /><text x="50" y="355" fill="#254b40" font-size="22">Local preview</text><path d="M285 325V390" fill="none" stroke="#af742b" stroke-width="3" stroke-dasharray="5 5"/><text x="330" y="355" fill="#254b40" font-size="22">Receiving service → authorised review</text><text x="50" y="395" fill="#254b40" font-size="20">A preview is not online data collection.</text></g></svg>