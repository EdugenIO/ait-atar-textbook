<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Read dependencies before scheduling the build</title><desc id="desc">Two prerequisite branches, approved content and prepared assets, converge on a build stage. A final check follows the build, showing why one ready input does not establish readiness for all work.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254b40"/></marker></defs><rect width="900" height="430" fill="#faf6ec"/><g font-family="system-ui,sans-serif" fill="#254b40"><text x="30" y="45" fill="#254b40" font-size="28">Read dependencies before scheduling the build</text><rect x="55" y="100" width="260" height="105" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="73" y="133" fill="#254b40" font-size="23">Content approval</text><text x="73" y="170" fill="#254b40" font-size="18">Client checks wording</text><rect x="55" y="260" width="260" height="105" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="73" y="293" fill="#254b40" font-size="23">Prepared assets</text><text x="73" y="330" fill="#254b40" font-size="18">Source and rights ready</text><rect x="425" y="180" width="180" height="110" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="443" y="213" fill="#254b40" font-size="23">Build</text><text x="443" y="250" fill="#254b40" font-size="18">Both required</text><rect x="695" y="180" width="175" height="110" rx="10" fill="#e8eee5" stroke="#254b40" stroke-width="2"/><text x="713" y="213" fill="#254b40" font-size="23">Check</text><text x="713" y="250" fill="#254b40" font-size="18">Revise / retest</text><path d="M315 155L425 210" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><path d="M315 310L425 260" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><path d="M605 235L695 235" fill="none" stroke="#254b40" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="365" fill="#254b40" font-size="23">One ready input ≠ both ready inputs</text></g></svg>