<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Compare the connection trade-off</title><desc id="desc">Illustration labels: Copper cable; Optic fibre; Wireless radio; Compare distance, installation, mobility and conditions.. Copper Ethernet: Consider distance, installation and electrical interference.. Fibre: Consider capacity, distance, equipment and installation cost.. Wireless: Consider mobility, coverage, interference and security.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Compare the connection trade-off</text><text x="45" y="135" font-size="22" fill="#183d31">Copper cable</text><path d="M250 125H790 M250 140H790" stroke="#96734d" stroke-width="8"/><text x="45" y="245" font-size="22" fill="#183d31">Optic fibre</text><path d="M250 235L790 235" stroke="#295849" stroke-width="3" fill="none"/><circle cx="300" cy="235" r="8" fill="#6552a0"/><circle cx="400" cy="235" r="8" fill="#6552a0"/><circle cx="500" cy="235" r="8" fill="#6552a0"/><circle cx="600" cy="235" r="8" fill="#6552a0"/><circle cx="700" cy="235" r="8" fill="#6552a0"/><text x="45" y="365" font-size="22" fill="#183d31">Wireless radio</text><path d="M350 390Q450 260 550 390 M310 410Q450 200 590 410 M270 430Q450 145 630 430" fill="none" stroke="#295849" stroke-width="6"/><text x="45" y="490" font-size="20" fill="#183d31">Compare distance, installation, mobility and conditions.</text></g></svg>