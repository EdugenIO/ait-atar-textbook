<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Keep working memory and storage distinct</title><desc id="desc">Illustration labels: RAM; Active work; Normally volatile; ROM; Firmware; Non-volatile; SSD; Saved files; Secondary storage; RAM and ROM are primary memory; an SSD is secondary storage.. RAM: Holds active working data; normally volatile.. Secondary storage: Keeps saved files without continuous power.. Workflow: Load a file into memory → edit → save changes to storage.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Keep working memory and storage distinct</text><rect x="55" y="140" width="220" height="200" rx="10" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="90" y="185" font-size="22" fill="#183d31">RAM</text><text x="75" y="240" font-size="20" fill="#183d31">Active work</text><text x="75" y="272" font-size="20" fill="#183d31">Normally volatile</text><rect x="350" y="140" width="220" height="200" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="385" y="185" font-size="22" fill="#183d31">ROM</text><text x="370" y="240" font-size="20" fill="#183d31">Firmware</text><text x="370" y="272" font-size="20" fill="#183d31">Non-volatile</text><rect x="640" y="140" width="220" height="200" rx="10" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="675" y="185" font-size="22" fill="#183d31">SSD</text><text x="660" y="240" font-size="20" fill="#183d31">Saved files</text><text x="660" y="272" font-size="20" fill="#183d31">Secondary storage</text><text x="45" y="455" font-size="20" fill="#183d31">RAM and ROM are primary memory; an SSD is secondary storage.</text></g></svg>