<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Reduce support as the learner gains independence</title><desc id="desc">Illustration labels: Show; Try with help; Try independently; Reduce supplied support as the learner can explain and apply the idea.. Show: Explain the complete Design + 4 example.. Try with support: Predict and correct 13 using the range rule.. Apply: Choose another workshop and explain a new value.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Reduce support as the learner gains independence</text><rect x="45" y="145" width="250" height="250" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="65" y="190" font-size="21" fill="#183d31">Show</text><rect x="75" y="230" width="175" height="25" rx="10" fill="#d1e2d5" stroke="#295849" stroke-width="2"/><rect x="75" y="275" width="175" height="25" rx="10" fill="#d1e2d5" stroke="#295849" stroke-width="2"/><rect x="75" y="320" width="175" height="25" rx="10" fill="#d1e2d5" stroke="#295849" stroke-width="2"/><rect x="335" y="145" width="250" height="250" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="355" y="190" font-size="21" fill="#183d31">Try with help</text><rect x="365" y="230" width="175" height="25" rx="10" fill="#d1e2d5" stroke="#295849" stroke-width="2"/><rect x="365" y="275" width="175" height="25" rx="10" fill="#d1e2d5" stroke="#295849" stroke-width="2"/><rect x="625" y="145" width="250" height="250" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="645" y="190" font-size="21" fill="#183d31">Try independently</text><rect x="655" y="230" width="175" height="25" rx="10" fill="#d1e2d5" stroke="#295849" stroke-width="2"/><text x="45" y="465" font-size="19" fill="#183d31">Reduce supplied support as the learner can explain and apply the idea.</text></g></svg>