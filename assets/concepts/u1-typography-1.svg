<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Align for scanning</title><desc id="desc">Illustration labels: Tea       $3; Cake         $5; Soup    $8; Tea; Cake; Soup; $3; $5; $8; Shared edges help readers scan and pair items with prices.. Shared edge: Headings and body text start consistently. Related columns: Each price stays associated with its item. Check: Find one item and its price</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Align for scanning</text><rect x="40" y="110" width="360" height="300" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><rect x="490" y="110" width="360" height="300" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="65" y="165" font-size="20" fill="#183d31">Tea       $3</text><text x="65" y="197" font-size="20" fill="#183d31">Cake         $5</text><text x="65" y="229" font-size="20" fill="#183d31">Soup    $8</text><text x="515" y="165" font-size="20" fill="#183d31">Tea</text><text x="515" y="197" font-size="20" fill="#183d31">Cake</text><text x="515" y="229" font-size="20" fill="#183d31">Soup</text><text x="780" y="165" font-size="20" fill="#183d31">$3</text><text x="780" y="197" font-size="20" fill="#183d31">$5</text><text x="780" y="229" font-size="20" fill="#183d31">$8</text><path d="M505 135L505 370" stroke="#295849" stroke-width="3" fill="none"/><path d="M765 135L765 370" stroke="#295849" stroke-width="3" fill="none"/><text x="45" y="460" font-size="21" fill="#183d31">Shared edges help readers scan and pair items with prices.</text></g></svg>