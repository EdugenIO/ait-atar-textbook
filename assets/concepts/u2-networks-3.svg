<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Read the role of each connection</title><desc id="desc">Illustration labels: Switch; Workstation; Server; Router; Label component roles and the upstream service boundary.. Internet ↔ router: Connect the LAN to another network. Switch ↔ wired devices: Connect devices within the LAN. Access point ↔ wireless devices: Provide wireless access to the LAN</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Read the role of each connection</text><rect x="350" y="210" width="210" height="100" rx="10" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="405" y="265" font-size="22" fill="#183d31">Switch</text><rect x="40" y="90" width="230" height="100" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="75" y="145" font-size="22" fill="#183d31">Workstation</text><rect x="630" y="90" width="230" height="100" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="675" y="145" font-size="22" fill="#183d31">Server</text><path d="M270 180L350 225" stroke="#295849" stroke-width="3" fill="none"/><path d="M630 180L560 225" stroke="#295849" stroke-width="3" fill="none"/><rect x="350" y="375" width="210" height="85" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="385" y="425" font-size="22" fill="#183d31">Router</text><path d="M455 310L455 375" stroke="#295849" stroke-width="3" fill="none"/><text x="45" y="490" font-size="20" fill="#183d31">Label component roles and the upstream service boundary.</text></g></svg>