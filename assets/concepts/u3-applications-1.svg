<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Read a layered timeline</title><desc id="desc">Illustration labels: 0 s; 4 s; 8 s; Picture; Scene cards; Title; Venue label; Voice; Narration; Separate tracks overlap in time.. Upper video track: Titles or overlays where visible. Base video track: Scenes beneath the overlay. Combined output: Check timing, compositing and readability</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Read a layered timeline</text><text x="150" y="115" font-size="22" fill="#183d31">0 s</text><text x="475" y="115" font-size="22" fill="#183d31">4 s</text><text x="800" y="115" font-size="22" fill="#183d31">8 s</text><path d="M150 130L800 130" stroke="#295849" stroke-width="3" fill="none"/><text x="40" y="190" font-size="20" fill="#183d31">Picture</text><rect x="150" y="155" width="650" height="55" rx="10" fill="#d7e6dc" stroke="#295849" stroke-width="2"/><text x="170" y="190" font-size="20" fill="#183d31">Scene cards</text><text x="40" y="275" font-size="20" fill="#183d31">Title</text><rect x="230" y="240" width="400" height="55" rx="10" fill="#e6dff0" stroke="#295849" stroke-width="2"/><text x="250" y="275" font-size="20" fill="#183d31">Venue label</text><text x="40" y="360" font-size="20" fill="#183d31">Voice</text><rect x="150" y="325" width="560" height="55" rx="10" fill="#cce0e7" stroke="#295849" stroke-width="2"/><text x="170" y="360" font-size="20" fill="#183d31">Narration</text><text x="45" y="465" font-size="20" fill="#183d31">Separate tracks overlap in time.</text></g></svg>