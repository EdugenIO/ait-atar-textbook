<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Connect a control to an outcome</title><desc id="desc">Illustration labels: Play; Expected result: motion starts.; A drawn button is not automatically an operable control.. Label: View opening hours. Action: Open the hours destination. Check: Keyboard and pointer reach the same useful result</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Connect a control to an outcome</text><rect x="110" y="150" width="260" height="140" rx="10" fill="#295849" stroke="#295849" stroke-width="2"/><path d="M150 180L150 250L205 215Z" fill="white"/><text x="225" y="225" fill="white" font-size="28">Play</text><path d="M390 215L495 215" stroke="#295849" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="520" y="125" width="330" height="240" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><circle cx="580" cy="250" r="26" fill="#6552a0"/><path d="M580 300L790 300" stroke="#295849" stroke-width="3" fill="none"/><text x="550" y="410" font-size="20" fill="#183d31">Expected result: motion starts.</text><text x="45" y="475" font-size="20" fill="#183d31">A drawn button is not automatically an operable control.</text></g></svg>