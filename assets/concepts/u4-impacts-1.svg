<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Separate the information questions</title><desc id="desc">Illustration labels: Personal; About an identified; or identifiable person.; Sensitive; A defined legal; category.; Confidential; Can include business; information too.; These questions overlap; removing a name may not prevent identification.. Personal: Does it identify or reasonably identify someone?. Sensitive: Does it fall within the applicable legal category?. Confidential: Who is authorised to obtain or share it?</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Separate the information questions</text><rect x="35" y="120" width="255" height="275" rx="10" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><rect x="325" y="120" width="255" height="275" rx="10" fill="#f2edf6" stroke="#295849" stroke-width="2"/><rect x="615" y="120" width="255" height="275" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="55" y="165" font-size="20" fill="#183d31">Personal</text><text x="55" y="197" font-size="20" fill="#183d31">About an identified</text><text x="55" y="229" font-size="20" fill="#183d31">or identifiable person.</text><text x="345" y="165" font-size="20" fill="#183d31">Sensitive</text><text x="345" y="197" font-size="20" fill="#183d31">A defined legal</text><text x="345" y="229" font-size="20" fill="#183d31">category.</text><text x="635" y="165" font-size="20" fill="#183d31">Confidential</text><text x="635" y="197" font-size="20" fill="#183d31">Can include business</text><text x="635" y="229" font-size="20" fill="#183d31">information too.</text><text x="45" y="465" font-size="19" fill="#183d31">These questions overlap; removing a name may not prevent identification.</text></g></svg>