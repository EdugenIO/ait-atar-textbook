<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Build motion from changing frames</title><desc id="desc">Illustration labels: Frame 1; Frame 2; Frame 3; Frame 4; Change the object position across the frames.; 24 frames at 12 frames per second occupy 2 seconds.. Frame 1: Object at the left. Frame 2: Object nearer the centre. Frame 3: Object farther right</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Build motion from changing frames</text><rect x="35" y="145" width="190" height="220" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><circle cx="65" cy="250" r="22" fill="#6552a0"/><text x="55" y="400" font-size="20" fill="#183d31">Frame 1</text><rect x="255" y="145" width="190" height="220" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><circle cx="317" cy="250" r="22" fill="#6552a0"/><text x="275" y="400" font-size="20" fill="#183d31">Frame 2</text><rect x="475" y="145" width="190" height="220" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><circle cx="569" cy="250" r="22" fill="#6552a0"/><text x="495" y="400" font-size="20" fill="#183d31">Frame 3</text><rect x="695" y="145" width="190" height="220" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><circle cx="821" cy="250" r="22" fill="#6552a0"/><text x="715" y="400" font-size="20" fill="#183d31">Frame 4</text><text x="45" y="100" font-size="22" fill="#183d31">Change the object position across the frames.</text><text x="45" y="470" font-size="22" fill="#183d31">24 frames at 12 frames per second occupy 2 seconds.</text></g></svg>