<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Pass essentials before ranking extras</title><desc id="desc">Illustration labels: Required app; supported?; No: flag / reject; Yes: compare extras; Unknown evidence stays unknown; it is not a pass.. Required app: Supported? If unknown, investigate.. Essential use: Meets mobility and runtime requirements?. Optional benefit: Then compare useful extras.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Pass essentials before ranking extras</text><path d="M450 100L650 260L450 420L250 260Z" fill="#e8f1e9" stroke="#295849" stroke-width="3"/><text x="345" y="235" font-size="20" fill="#183d31">Required app</text><text x="345" y="267" font-size="20" fill="#183d31">supported?</text><path d="M250 260L80 260" stroke="#295849" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="45" y="220" font-size="22" fill="#183d31">No: flag / reject</text><path d="M650 260L835 260" stroke="#295849" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="670" y="220" font-size="22" fill="#183d31">Yes: compare extras</text><text x="45" y="485" font-size="21" fill="#183d31">Unknown evidence stays unknown; it is not a pass.</text></g></svg>