<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Make the asset trail visible</title><desc id="desc">Illustration labels: Source; Working v03; Export; Keep creator / licence records with the source.; Record what changed in the working version.; Check the actual delivery file.. Original: Keep an unchanged source. Working copy: Use meaningful names and versions. Delivery: Export and check the required format</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Make the asset trail visible</text><rect x="40" y="150" width="175" height="130" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><path d="M170 150V185H215" stroke="#295849" stroke-width="2" fill="none"/><text x="54" y="240" font-size="20" fill="#183d31">Source</text><rect x="360" y="150" width="175" height="130" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><path d="M490 150V185H535" stroke="#295849" stroke-width="2" fill="none"/><text x="374" y="240" font-size="20" fill="#183d31">Working v03</text><rect x="680" y="150" width="175" height="130" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><path d="M810 150V185H855" stroke="#295849" stroke-width="2" fill="none"/><text x="694" y="240" font-size="20" fill="#183d31">Export</text><path d="M225 215L345 215" stroke="#295849" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M545 215L665 215" stroke="#295849" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="45" y="370" font-size="20" fill="#183d31">Keep creator / licence records with the source.</text><text x="45" y="402" font-size="20" fill="#183d31">Record what changed in the working version.</text><text x="45" y="434" font-size="20" fill="#183d31">Check the actual delivery file.</text></g></svg>