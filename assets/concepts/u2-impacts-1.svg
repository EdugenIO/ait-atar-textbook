<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Separate access and use</title><desc id="desc">Illustration labels: Staff member; Customer record; Work need?; Permitted use?; Authorised access?; Being able to open a file does not authorise every use.. Can access: A person or system can obtain the data. May use: The proposed purpose has an appropriate basis. Should collect: Only the information needed for that purpose</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Separate access and use</text><circle cx="100" cy="155" r="20" fill="#295849"/><path d="M70 220Q70 180 100 180Q130 180 130 220Z" fill="#b8cfbf"/><text x="35" y="260" font-size="20" fill="#183d31">Staff member</text><rect x="350" y="155" width="175" height="130" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><path d="M480 155V190H525" stroke="#295849" stroke-width="2" fill="none"/><text x="364" y="245" font-size="20" fill="#183d31">Customer record</text><path d="M175 205L330 205" stroke="#295849" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="635" y="145" width="220" height="200" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="655" y="190" font-size="20" fill="#183d31">Work need?</text><text x="655" y="222" font-size="20" fill="#183d31">Permitted use?</text><text x="655" y="254" font-size="20" fill="#183d31">Authorised access?</text><path d="M540 215L615 215" stroke="#295849" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="40" y="465" font-size="21" fill="#183d31">Being able to open a file does not authorise every use.</text></g></svg>