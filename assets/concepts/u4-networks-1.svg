<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Keep communication jobs distinct</title><desc id="desc">Illustration labels: HTTP: request / response; TLS: protected transport; TCP: reliable ordered stream; IP: addressing / forwarding; Example stack: HTTP/2 over TLS over TCP/IP; HTTP/3 differs.. HTTP: Request or respond to a web resource.. TCP: Provide a reliable ordered stream in this assumed connection.. IP: Address and forward packets between networks.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Keep communication jobs distinct</text><rect x="150" y="105" width="600" height="65" rx="10" fill="#e7f0e8" stroke="#295849" stroke-width="2"/><text x="175" y="147" font-size="23" fill="#183d31">HTTP: request / response</text><rect x="168" y="190" width="564" height="65" rx="10" fill="#e6def0" stroke="#295849" stroke-width="2"/><text x="193" y="232" font-size="23" fill="#183d31">TLS: protected transport</text><rect x="186" y="275" width="528" height="65" rx="10" fill="#d7e8ee" stroke="#295849" stroke-width="2"/><text x="211" y="317" font-size="23" fill="#183d31">TCP: reliable ordered stream</text><rect x="204" y="360" width="492" height="65" rx="10" fill="#f1e9d9" stroke="#295849" stroke-width="2"/><text x="229" y="402" font-size="23" fill="#183d31">IP: addressing / forwarding</text><text x="45" y="485" font-size="19" fill="#183d31">Example stack: HTTP/2 over TLS over TCP/IP; HTTP/3 differs.</text></g></svg>