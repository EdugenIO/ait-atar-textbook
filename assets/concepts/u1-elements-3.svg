<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Distinguish texture from form</title><desc id="desc">Illustration labels: Texture: a surface pattern; Form: suggested depth; A smooth screen can depict texture and three-dimensional form.. Texture: A surface quality: smooth, rough or patterned.. Form: A three-dimensional shape, or an illusion of volume.. Example: A flat drawing can suggest both through marks and shading.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Distinguish texture from form</text><rect x="40" y="120" width="350" height="280" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="65" y="160" font-size="22" fill="#183d31">Texture: a surface pattern</text><path d="M65 190Q150 165 355 193" fill="none" stroke="#8d7254" stroke-width="3"/><path d="M65 213Q150 188 355 216" fill="none" stroke="#8d7254" stroke-width="3"/><path d="M65 236Q150 211 355 239" fill="none" stroke="#8d7254" stroke-width="3"/><path d="M65 259Q150 234 355 262" fill="none" stroke="#8d7254" stroke-width="3"/><path d="M65 282Q150 257 355 285" fill="none" stroke="#8d7254" stroke-width="3"/><path d="M65 305Q150 280 355 308" fill="none" stroke="#8d7254" stroke-width="3"/><path d="M65 328Q150 303 355 331" fill="none" stroke="#8d7254" stroke-width="3"/><path d="M65 351Q150 326 355 354" fill="none" stroke="#8d7254" stroke-width="3"/><defs><radialGradient id="ball"><stop stop-color="#edf4e5"/><stop offset="1" stop-color="#295849"/></radialGradient></defs><circle cx="650" cy="265" r="105" fill="url(#ball)"/><text x="485" y="140" font-size="22" fill="#183d31">Form: suggested depth</text><text x="40" y="465" font-size="20" fill="#183d31">A smooth screen can depict texture and three-dimensional form.</text></g></svg>