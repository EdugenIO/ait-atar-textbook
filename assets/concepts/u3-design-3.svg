<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Choose controls for the situation</title><desc id="desc">Illustration labels: Phone: labelled links; Programme; Session A →; Kiosk: clear return; Home; Controls must suit the task, medium and input methods.. Phone: Readable labels and usable touch targets. Keyboard: Logical focus and operable controls. Return route: A clear way back to the programme</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Choose controls for the situation</text><rect x="60" y="110" width="210" height="290" rx="22" fill="#fff" stroke="#295849" stroke-width="2"/><rect x="78" y="140" width="174" height="210" rx="10" fill="#f3f7ef" stroke="#295849" stroke-width="2"/><text x="85" y="385" font-size="20" fill="#183d31">Phone: labelled links</text><text x="100" y="185" font-size="22" fill="#183d31">Programme</text><text x="100" y="235" font-size="22" fill="#183d31">Session A →</text><rect x="520" y="120" width="325" height="280" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="550" y="165" font-size="22" fill="#183d31">Kiosk: clear return</text><rect x="550" y="220" width="265" height="80" rx="10" fill="#295849" stroke="#295849" stroke-width="2"/><text x="585" y="270" fill="white" font-size="27">Home</text><text x="45" y="465" font-size="20" fill="#183d31">Controls must suit the task, medium and input methods.</text></g></svg>