<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Choose an approach for the uncertainty</title><desc id="desc">Illustration labels: Prototype approach; Trial version; Feedback and revision; Structured approach; Plan; Build; Review; Both approaches can include feedback; choose for the uncertainty.. Unclear interaction: Trial a prototype and collect feedback.. Well-defined stages: Use planned activities and review points.. Both: Control changes and keep evidence.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Choose an approach for the uncertainty</text><rect x="40" y="115" width="350" height="280" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="65" y="155" font-size="22" fill="#183d31">Prototype approach</text><rect x="90" y="200" width="240" height="75" rx="10" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><text x="115" y="245" font-size="22" fill="#183d31">Trial version</text><path d="M330 238Q380 350 145 340Q70 320 90 245" stroke="#295849" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="110" y="370" font-size="19" fill="#183d31">Feedback and revision</text><rect x="500" y="115" width="350" height="280" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="525" y="155" font-size="22" fill="#183d31">Structured approach</text><rect x="525" y="190" width="300" height="42" rx="10" fill="#edf3e8" stroke="#295849" stroke-width="2"/><text x="537" y="218" font-size="19" fill="#183d31">Plan</text><rect x="525" y="255" width="240" height="42" rx="10" fill="#edf3e8" stroke="#295849" stroke-width="2"/><text x="537" y="283" font-size="19" fill="#183d31">Build</text><rect x="525" y="320" width="300" height="42" rx="10" fill="#edf3e8" stroke="#295849" stroke-width="2"/><text x="537" y="348" font-size="19" fill="#183d31">Review</text><text x="45" y="465" font-size="19" fill="#183d31">Both approaches can include feedback; choose for the uncertainty.</text></g></svg>