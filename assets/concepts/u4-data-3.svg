<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Three records, three purposes</title><desc id="desc">Illustration labels: Backup; Archive; Audit trail; Recover lost data.; Retain records.; Trace events.; Different purposes: a log is not normally a complete recovery copy.. Backup: Recover after loss or damage. Archive: Keep records for longer-term reference. Audit trail: Trace events and changes</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Three records, three purposes</text><rect x="45" y="155" width="175" height="130" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><path d="M175 155V190H220" stroke="#295849" stroke-width="2" fill="none"/><text x="59" y="245" font-size="20" fill="#183d31">Backup</text><rect x="360" y="155" width="175" height="130" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><path d="M490 155V190H535" stroke="#295849" stroke-width="2" fill="none"/><text x="374" y="245" font-size="20" fill="#183d31">Archive</text><rect x="675" y="155" width="175" height="130" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><path d="M805 155V190H850" stroke="#295849" stroke-width="2" fill="none"/><text x="689" y="245" font-size="20" fill="#183d31">Audit trail</text><text x="45" y="355" font-size="20" fill="#183d31">Recover lost data.</text><text x="360" y="355" font-size="20" fill="#183d31">Retain records.</text><text x="675" y="355" font-size="20" fill="#183d31">Trace events.</text><text x="45" y="465" font-size="19" fill="#183d31">Different purposes: a log is not normally a complete recovery copy.</text></g></svg>