<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Read in context</title><desc id="desc">Illustration labels: WORKSHOP; Saturday; Hall 2; Small supporting heading; A striking image can compete with a top-to-bottom reading tendency.. Phone: Narrow lines and changing text size. Poster: Read at the intended distance. Check: Actual output size and audience task</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Read in context</text><rect x="45" y="110" width="355" height="300" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><rect x="495" y="110" width="355" height="300" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="65" y="160" font-size="28" fill="#183d31">WORKSHOP</text><text x="65" y="205" font-size="20" fill="#183d31">Saturday</text><text x="65" y="237" font-size="20" fill="#183d31">Hall 2</text><circle cx="675" cy="225" r="90" fill="#6552a0"/><text x="520" y="370" font-size="18" fill="#183d31">Small supporting heading</text><text x="45" y="460" font-size="20" fill="#183d31">A striking image can compete with a top-to-bottom reading tendency.</text></g></svg>