<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Compare communication modes</title><desc id="desc">Illustration labels: Live demonstration; Ask now; Recorded / text guide; Pause; Revisit; Ask through a help route; Choose for the learning task, timing and access needs.. Live: Shared time; immediate discussion; connection and scheduling needs.. Recorded or text: Revisit at different times; plan a route for questions.. Discussion space: Peer explanations; moderation and participation support.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295849"/></marker></defs><rect width="900" height="540" fill="#fcfdf9"/><g font-family="Arial, sans-serif"><text x="30" y="48" font-size="28" fill="#183d31">Compare communication modes</text><rect x="45" y="120" width="350" height="290" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="70" y="165" font-size="22" fill="#183d31">Live demonstration</text><rect x="80" y="200" width="280" height="125" rx="10" fill="#e8f1e9" stroke="#295849" stroke-width="2"/><circle cx="150" cy="235" r="20" fill="#295849"/><path d="M120 300Q120 260 150 260Q180 260 180 300Z" fill="#b8cfbf"/><text x="85" y="340" font-size="20" fill="#183d31">Ask now</text><rect x="505" y="120" width="350" height="290" rx="10" fill="#fff" stroke="#295849" stroke-width="2"/><text x="530" y="165" font-size="22" fill="#183d31">Recorded / text guide</text><rect x="535" y="200" width="300" height="42" rx="10" fill="#edf3e8" stroke="#295849" stroke-width="2"/><text x="547" y="228" font-size="19" fill="#183d31">Pause</text><rect x="535" y="265" width="240" height="42" rx="10" fill="#edf3e8" stroke="#295849" stroke-width="2"/><text x="547" y="293" font-size="19" fill="#183d31">Revisit</text><rect x="535" y="330" width="300" height="42" rx="10" fill="#edf3e8" stroke="#295849" stroke-width="2"/><text x="547" y="358" font-size="19" fill="#183d31">Ask through a help route</text><text x="45" y="470" font-size="20" fill="#183d31">Choose for the learning task, timing and access needs.</text></g></svg>