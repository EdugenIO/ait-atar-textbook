<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">One master, two delivery paths</title><desc id="d">An editable master branches to a cropped sRGB screen image and a print layout with trim and bleed. Both exports must be reopened and proofed; print also needs the agreed printer conditions.</desc><rect width="1000" height="420" fill="#f3f7f1"/><g font-family="Arial" fill="#173f35"><rect x="25" y="140" width="230" height="150" fill="white" stroke="#245b4b"/><text x="45" y="185" font-size="25">Editable master</text><rect x="45" y="210" width="185" height="50" fill="#173f35"/><text x="57" y="242" fill="white" font-size="18">KEEP SOURCE</text><path d="M255 215H310V95H355M310 215V325H355M625 95H700M625 325H700" fill="none" stroke="#245b4b" stroke-width="4"/><rect x="355" y="30" width="270" height="130" rx="8" fill="white" stroke="#245b4b"/><text x="375" y="70" font-size="25">Screen copy</text><text x="375" y="105" font-size="20">Crop · pixels · sRGB</text><text x="375" y="135" font-size="20">Inspect final file</text><rect x="355" y="255" width="270" height="135" rx="8" fill="white" stroke="#245b4b"/><rect x="372" y="273" width="38" height="70" fill="#df8c4f"/><rect x="378" y="279" width="26" height="58" fill="white" stroke="#173f35"/><text x="425" y="298" font-size="25">Print copy</text><text x="425" y="330" font-size="18">Trim + bleed</text><text x="375" y="370" font-size="18">Agreed profile / PDF settings</text><text x="720" y="85" font-size="24">Reopen + check</text><text x="720" y="120" font-size="20">Readable at delivery size?</text><text x="720" y="305" font-size="24">Proof + approve</text><text x="720" y="340" font-size="20">Correct output condition?</text></g></svg>