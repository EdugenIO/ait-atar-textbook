<svg xmlns="http://www.w3.org/2000/svg" width="216mm" height="154mm" viewBox="0 0 2592 1848"><title>Editable workshop artwork with 3 mm bleed</title><desc>Workshop title, session information, joining instruction and four colour swatches. The canvas includes bleed beyond an A5 landscape trim.</desc><rect width="2592" height="1848" fill="#173f35"/><rect x="110" y="580" width="2370" height="470" fill="#e9ecd4"/><g font-family="Arial,sans-serif"><text x="180" y="330" font-size="150" font-weight="700" fill="#ffffff">MAKE + REPAIR</text><text x="180" y="480" font-size="90" font-weight="400" fill="#ffffff">Community workshop</text><text x="180" y="775" font-size="95" font-weight="700" fill="#173f35">4 May 2027 · 10 am</text><text x="180" y="905" font-size="75" font-weight="400" fill="#173f35">Hall 2 · Bring one small item</text><text x="180" y="1228" font-size="78" font-weight="700" fill="#ffffff">Ask at the library to join</text><rect x="180" y="1460" width="280" height="190" fill="#e9ecd4"/><rect x="560" y="1460" width="280" height="190" fill="#df8c4f"/><rect x="940" y="1460" width="280" height="190" fill="#79b6bb"/><rect x="1320" y="1460" width="280" height="190" fill="#b2a2cd"/></g></svg>