<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="t d"><title id="t">Compare seven design elements</title><desc id="d">Line directs attention; shape is flat; space separates; texture repeats surface marks; colour changes hue; shading suggests a three-dimensional form; tone changes lightness.</desc><defs><radialGradient id="sphere" cx="30%" cy="25%"><stop stop-color="#fff"/><stop offset=".45" stop-color="#aaa"/><stop offset="1" stop-color="#222"/></radialGradient><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2" fill="#285747"/></pattern></defs><rect width="900" height="260" fill="#f7f3e9"/><g font-family="Arial,sans-serif" font-size="18" fill="#18322d"><text x="22" y="40">Line</text><path d="M20 140L105 85" stroke="#285747" stroke-width="5"/><text x="142" y="40">Shape</text><circle cx="180" cy="115" r="38" fill="#285747"/><text x="260" y="40">Space</text><rect x="260" y="70" width="100" height="100" fill="white" stroke="#285747"/><circle cx="310" cy="120" r="12" fill="#285747"/><text x="390" y="40">Texture</text><rect x="390" y="75" width="90" height="90" fill="url(#dots)"/><text x="515" y="40">Colour</text><rect x="515" y="85" width="40" height="70" fill="#285747"/><rect x="555" y="85" width="40" height="70" fill="#8c491a"/><text x="650" y="40">3D form</text><circle cx="685" cy="115" r="42" fill="url(#sphere)"/><text x="790" y="40">Tone</text><rect x="780" y="85" width="30" height="70" fill="#ddd"/><rect x="810" y="85" width="30" height="70" fill="#888"/><rect x="840" y="85" width="30" height="70" fill="#222"/><text x="22" y="225">These isolate one feature for comparison. In an actual composition, elements work together.</text></g></svg>