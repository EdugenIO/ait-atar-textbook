<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">Proposed community-centre LAN</title><desc id="desc">Staff PCs and server connect to a switch. Staff wireless is proposed on the staff network. A guest access point uses a separately configured guest boundary at the router/firewall. Guest-to-staff access must be denied and tested; internet access is intended. This is a proposal, not an implemented configuration.</desc><rect width="960" height="530" fill="#f7f3e9"/><g font-family="sans-serif" fill="#233d30" font-size="19"><text x="25" y="35" font-size="25">Proposed LAN · roles, links and access boundaries</text><g fill="white" stroke="#426451" stroke-width="2"><rect x="350" y="65" width="260" height="55"/><rect x="350" y="160" width="260" height="70"/><rect x="55" y="290" width="220" height="55"/><rect x="370" y="290" width="220" height="55"/><rect x="700" y="290" width="220" height="55"/><rect x="30" y="405" width="180" height="55"/><rect x="235" y="405" width="180" height="55"/><rect x="445" y="405" width="215" height="55"/></g><g fill="none" stroke="#426451" stroke-width="3"><path d="M480 120V160M390 230L165 290M480 230V290M570 230L810 290M130 345L120 405M190 345L325 405"/><path d="M480 345L550 405" stroke-dasharray="8 5"/></g><text x="395" y="100">Upstream internet</text><text x="380" y="188">Router / firewall</text><text x="380" y="215">Configured boundaries</text><text x="82" y="325">Staff switch</text><text x="393" y="325">Staff access point</text><text x="722" y="325">Guest access point</text><text x="53" y="440">Staff PCs / NICs</text><text x="272" y="440">Staff server</text><text x="463" y="440">Roaming volunteer</text><text x="690" y="380" font-size="17">Guest → internet: permit</text><text x="690" y="405" font-size="17">Guest → staff: deny</text><text x="25" y="495" font-size="17">Solid: proposed wired links. Dashed: radio. Separate SSID names alone do not prove isolation.</text><text x="25" y="520" font-size="17">Configure and test authorised/denied paths, file permissions, coverage and representative load.</text></g></svg>