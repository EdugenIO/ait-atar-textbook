<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="t d"><title id="t">Fictional shop LAN model</title><desc id="d">Provider connection passes through service equipment and a router to a switch. Wired endpoints are PCs with NICs, a server, printer and access point. A roaming laptop connects to the access point by radio.</desc><rect width="900" height="480" fill="#f7f3e9"/><g stroke="#285747" stroke-width="3" fill="none"><path d="M120 80H270M450 80H600M600 110V185M550 255L150 315M585 255L350 315M620 255L550 315M655 255L740 315"/><path d="M740 380L820 430" stroke-dasharray="7 5"/></g><g fill="white" stroke="#285747" stroke-width="2"><rect x="20" y="45" width="160" height="70"/><rect x="220" y="45" width="270" height="70"/><rect x="540" y="45" width="160" height="70"/><rect x="520" y="185" width="160" height="70"/><rect x="70" y="315" width="160" height="70"/><rect x="270" y="315" width="160" height="70"/><rect x="470" y="315" width="160" height="70"/><rect x="660" y="315" width="160" height="70"/></g><g font-family="Arial,sans-serif" font-size="20" fill="#18322d" text-anchor="middle"><text x="100" y="87">Provider</text><text x="355" y="86">Modem/ONT as required</text><text x="620" y="87">Router</text><text x="600" y="228">Switch</text><text x="150" y="355">PCs + NICs</text><text x="350" y="355">Server</text><text x="550" y="355">Printer</text><text x="740" y="355">Access point</text><text x="750" y="462">Roaming laptop · radio link</text><text x="240" y="150" font-size="18">Label actual equipment roles and site assumptions</text></g></svg>