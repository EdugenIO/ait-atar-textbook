<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Three-page navigation map</title><desc id="d">Home links to Services and Contact; Services and Contact link to each other and back to Home through persistent navigation.</desc><g fill="#f7f3e9" stroke="#285747" stroke-width="3"><rect x="330" y="25" width="240" height="70"/><rect x="80" y="200" width="240" height="70"/><rect x="580" y="200" width="240" height="70"/><path d="M380 95L220 200M520 95L680 200M320 235H580"/></g><g font-family="Arial,sans-serif" font-size="24" fill="#18322d" text-anchor="middle"><text x="450" y="70">Home</text><text x="200" y="245">Services</text><text x="700" y="245">Contact</text><text x="450" y="150" font-size="18">Every line represents routes in both directions</text></g></svg>