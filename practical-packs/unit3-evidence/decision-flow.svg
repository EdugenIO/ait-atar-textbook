<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Route decision flow</title><desc id="desc">Open programme, choose a session, read time and room, then decide whether the route is usable. Yes leads to follow route and finish. No leads to ask for access arrangements and review an agreed alternative.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#426451"/></marker></defs><rect width="900" height="480" fill="#f8f5ee"/><g font-family="sans-serif" font-size="19" fill="#213b35"><text x="30" y="35" font-size="24">Flow chart · visitor decision and alternative</text><g stroke="#426451" fill="white"><rect x="260" y="55" width="380" height="65" rx="20"/><rect x="260" y="150" width="380" height="70"/><path d="M450 250L610 315L450 380L290 315Z"/><rect x="30" y="280" width="220" height="80" rx="15"/><rect x="650" y="265" width="220" height="110"/></g><g fill="none" stroke="#426451" stroke-width="3" marker-end="url(#arrow)"><path d="M450 120V150"/><path d="M450 220V250"/><path d="M290 315H250"/><path d="M610 315H650"/></g><text x="305" y="95">Start: open Programme</text><text x="285" y="178">Choose session; read time</text><text x="285" y="204">and room</text><text x="348" y="322">Route usable?</text><text x="256" y="297">Yes</text><text x="615" y="297">No</text><text x="48" y="313">Follow route</text><text x="48" y="340">and finish</text><text x="668" y="295">Ask for access</text><text x="668" y="322">arrangements;</text><text x="668" y="349">review alternative</text><text x="30" y="435">The prototype provides information only. It does not submit a request.</text><text x="30" y="463">Actual event routes and agreed alternatives require a client check.</text></g></svg>