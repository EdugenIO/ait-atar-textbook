<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc"><title id="title">Twelve-second festival storyboard</title><desc id="desc">Three four-second panels: festival title, venue approach and venue label. Captions and narration are planned separately.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#426451"/></marker></defs><rect width="900" height="260" fill="#f8f5ee"/><g font-family="sans-serif" font-size="19" fill="#213b35"><text x="30" y="35" font-size="24">Storyboard · planned sequence, not recorded playback</text><g stroke="#426451" fill="white"><rect x="30" y="60" width="260" height="150"/><rect x="320" y="60" width="260" height="150"/><rect x="610" y="60" width="260" height="150"/></g><text x="45" y="90">0–4 seconds</text><text x="45" y="130">Festival title</text><text x="45" y="165">Establishing scene</text><text x="335" y="90">4–8 seconds</text><text x="335" y="130">Approach to venue</text><text x="335" y="165">Explain programme</text><text x="625" y="90">8–12 seconds</text><text x="625" y="130">Venue label</text><text x="625" y="165">Keep captions clear</text><text x="30" y="242">Separate picture, labels and narration in the editable timeline.</text></g></svg>