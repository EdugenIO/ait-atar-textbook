<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Festival information hierarchy</title><desc id="desc">Programme is the parent with Printmaking and Photography child sections. Both details sections return to Programme. Help is available beside the programme.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#426451"/></marker></defs><rect width="900" height="300" fill="#f8f5ee"/><g font-family="sans-serif" font-size="19" fill="#213b35"><text x="30" y="35" font-size="24">Site map · same-page section destinations</text><g stroke="#426451" fill="white"><rect x="315" y="60" width="270" height="60"/><rect x="80" y="185" width="300" height="60"/><rect x="520" y="185" width="300" height="60"/></g><g fill="none" stroke="#426451" stroke-width="3" marker-end="url(#arrow)"><path d="M380 120L240 185"/><path d="M520 120L660 185"/><path d="M210 185L350 120"/><path d="M690 185L550 120"/></g><text x="395" y="98">Programme</text><text x="130" y="223">Printmaking details</text><text x="565" y="223">Photography details</text><text x="30" y="280">Each detail returns to Programme. Contextual help sits beside the programme.</text></g></svg>